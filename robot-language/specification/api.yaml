language:
  name: Robot Language
  version: 1.0.0
  description: Robot Language Specification

categories:

  motion:
    description: Motion control APIs
    module: motion_handler
    handler: MotionHandler

    functions:
      - name: forward
        opcode: Forward
        opcode_id: 2
        description: Move robot forward
        args:
          - name: speed
            type: int

      - name: backward
        opcode: Backward
        opcode_id: 3
        description: Move robot backward
        args:
          - name: speed
            type: int

      - name: turn_left
        opcode: TurnLeft
        opcode_id: 4
        description: Rotate robot left
        args:
          - name: speed
            type: int

      - name: turn_right
        opcode: TurnRight
        opcode_id: 5
        description: Rotate robot right
        args:
          - name: speed
            type: int

  system:
    module: system_handler
    handler: SystemHandler

    functions:
      - name: wait
        opcode: Wait
        opcode_id: 7
        description: Wait milliseconds
        args:
          - name: milliseconds
            type: int

      - name: stop
        opcode: Stop
        opcode_id: 6
        description: Stop robot
        args: []

  internal:
    description: Internal opcodes (do not expose to users)
    module: internal
    handler: None

    functions:
      - name: LoadConst
        opcode: LoadConst
        opcode_id: 1
        description: Load constant to variable
        args: []
      - name: CompareEQ
        opcode: CompareEQ
        opcode_id: 8
        description: Compare equal
        args: []
      - name: CompareNE
        opcode: CompareNE
        opcode_id: 9
        description: Compare not equal
        args: []
      - name: CompareLT
        opcode: CompareLT
        opcode_id: 10
        description: Compare less than
        args: []
      - name: CompareLE
        opcode: CompareLE
        opcode_id: 11
        description: Compare less or equal
        args: []
      - name: CompareGT
        opcode: CompareGT
        opcode_id: 12
        description: Compare greater than
        args: []
      - name: CompareGE
        opcode: CompareGE
        opcode_id: 13
        description: Compare greater or equal
        args: []
      - name: Jump
        opcode: Jump
        opcode_id: 14
        description: Unconditional jump
        args: []
      - name: JumpIfFalse
        opcode: JumpIfFalse
        opcode_id: 15
        description: Jump if false
        args: []
      - name: JumpIfTrue
        opcode: JumpIfTrue
        opcode_id: 16
        description: Jump if true
        args: []
      - name: Label
        opcode: Label
        opcode_id: 17
        description: Label placeholder
        args: []
      # --- Arithmetic opcodes ---
      - name: Add
        opcode: Add
        opcode_id: 20
        description: Addition
        args: []
      - name: Sub
        opcode: Sub
        opcode_id: 21
        description: Subtraction
        args: []
      - name: Mul
        opcode: Mul
        opcode_id: 22
        description: Multiplication
        args: []
      - name: Div
        opcode: Div
        opcode_id: 23
        description: Integer division
        args: []
      - name: Mod
        opcode: Mod
        opcode_id: 24
        description: Modulo
        args: []
      - name: Pow
        opcode: Pow
        opcode_id: 25
        description: Power (integer exponent)
        args: []
      - name: Neg
        opcode: Neg
        opcode_id: 26
        description: Negate
        args: []
      - name: Call
        opcode: Call
        opcode_id: 27
        description: Call user function
        args: []
      - name: Return
        opcode: Return
        opcode_id: 28
        description: Return from function
        args: []
      - name: Store
        opcode: Store
        opcode_id: 29
        description: Store value from source to destination variable
        args: []   
  sensor:
    description: Sensor APIs
    module: sensor_handler
    handler: SensorHandler

    functions:
      - name: read_ultrasonic
        opcode: ReadUltrasonic
        opcode_id: 30
        description: Read ultrasonic distance in cm
        args: []
        returns: int

      - name: read_touch
        opcode: ReadTouch
        opcode_id: 31
        description: Read touch sensor state (0/1)
        args:
          - name: port
            type: int
        returns: int

      - name: read_light
        opcode: ReadLight
        opcode_id: 32
        description: Read light sensor raw value (0-1023)
        args:
          - name: channel
            type: int
        returns: int

      - name: read_color
        opcode: ReadColor
        opcode_id: 33
        description: Read color sensor (placeholder)
        args: []
        returns: int

      - name: read_line
        opcode: ReadLine
        opcode_id: 34
        description: Read line sensor (0=white, 1=dark)
        args:
          - name: channel
            type: int
        returns: int         