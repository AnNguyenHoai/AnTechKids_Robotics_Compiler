language:
  name: Robot Language
  version: 1.0.0
  description: Robot Language Specification

categories:

  motion:
    description: Motion control APIs
    module: motion_handler
    handler: MotionHandler

    functions:
      - name: forward
        opcode: Forward
        opcode_id: 2
        description: Move robot forward
        args:
          - name: speed
            type: int

      - name: backward
        opcode: Backward
        opcode_id: 3
        description: Move robot backward
        args:
          - name: speed
            type: int

      - name: turn_left
        opcode: TurnLeft
        opcode_id: 4
        description: Rotate robot left
        args:
          - name: speed
            type: int

      - name: turn_right
        opcode: TurnRight
        opcode_id: 5
        description: Rotate robot right
        args:
          - name: speed
            type: int

  system:
    module: system_handler
    handler: SystemHandler

    functions:
      - name: wait
        opcode: Wait
        opcode_id: 7
        description: Wait milliseconds
        args:
          - name: milliseconds
            type: int

      - name: stop
        opcode: Stop
        opcode_id: 6
        description: Stop robot
        args: []

  internal:
    description: Internal opcodes (do not expose to users)
    module: internal
    handler: None

    functions:
      - name: LoadConst
        opcode: LoadConst
        opcode_id: 1
        description: Load constant to variable
        args: []
      - name: CompareEQ
        opcode: CompareEQ
        opcode_id: 8
        description: Compare equal
        args: []
      - name: CompareNE
        opcode: CompareNE
        opcode_id: 9
        description: Compare not equal
        args: []
      - name: CompareLT
        opcode: CompareLT
        opcode_id: 10
        description: Compare less than
        args: []
      - name: CompareLE
        opcode: CompareLE
        opcode_id: 11
        description: Compare less or equal
        args: []
      - name: CompareGT
        opcode: CompareGT
        opcode_id: 12
        description: Compare greater than
        args: []
      - name: CompareGE
        opcode: CompareGE
        opcode_id: 13
        description: Compare greater or equal
        args: []
      - name: Jump
        opcode: Jump
        opcode_id: 14
        description: Unconditional jump
        args: []
      - name: JumpIfFalse
        opcode: JumpIfFalse
        opcode_id: 15
        description: Jump if false
        args: []
      - name: JumpIfTrue
        opcode: JumpIfTrue
        opcode_id: 16
        description: Jump if true
        args: []
      - name: Label
        opcode: Label
        opcode_id: 17
        description: Label placeholder
        args: []