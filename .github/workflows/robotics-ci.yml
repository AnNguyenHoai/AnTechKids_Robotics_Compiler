name: Robotics Compiler Tests

on:
  push:
    branches:
      - main
      - "rsd-*"
      - "audit/**"
      - "fix/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          git --version

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-ci.txt

      - name: Validate test topology
        shell: pwsh
        run: |
          python -c "from pathlib import Path; required=['robot-language/tests','robot-compiler/tests','robot-frontend-robosim/test','robostudio/tests','tests']; missing=[p for p in required if not Path(p).is_dir()]; assert not missing, f'Missing test boundaries: {missing}'; print('PASS: test topology boundaries')"

      - name: Run repository regression suite
        shell: pwsh
        run: python run_all_tests.py

      - name: Run RSD acceptance suite
        shell: pwsh
        run: |
          python tests/rsd_11/run_rsd_11.py
          python tests/rsd_15/run_rsd_15.py
          python tests/rsd_17/run_rsd_17.py
          python tests/rsd_20/run_rsd_20.py
          python tests/rsd_21_3/run_rsd_21_3.py
          python tests/rsd_21_4/run_rsd_21_4.py
          python tests/rsd_21_5/run_rsd_21_5.py
          python tests/rsd_21_6/run_rsd_21_6.py
          python tests/rsd_21_7/run_rsd_21_7.py
          python tests/rsd_21_8/run_rsd_21_8.py

      - name: Collect test artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path . -Recurse -File -Include *.json,*.log,*.txt |
            Where-Object { $_.FullName -notmatch '\\.git[\\/]' } |
            ForEach-Object {
              $destination = Join-Path artifacts $_.Name
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
