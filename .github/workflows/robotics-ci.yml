name: Robotics Compiler Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: "CI scope: auto impact selection, full regression, or release build"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - release

permissions:
  contents: read

jobs:
  tests:
    name: Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          git --version

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-ci.txt

      - name: Validate CI impact selector
        shell: pwsh
        run: python tools/ci_impact.py --self-test

      - name: Detect impacted CI scope
        id: impact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
        run: |
          $base = $env:PR_BASE_SHA
          if (-not $base) { $base = $env:BEFORE_SHA }
          if (-not $base -or $base -match '^0+$') {
            $base = git rev-parse HEAD^
          }
          Write-Host "Impact diff: $base...$env:HEAD_SHA (scope=$env:REQUESTED_SCOPE)"
          python tools/ci_impact.py --base $base --head $env:HEAD_SHA --scope $env:REQUESTED_SCOPE --github-output $env:GITHUB_OUTPUT

      - name: Validate test topology
        shell: pwsh
        run: |
          python -c "from pathlib import Path; required=['robot-language/tests','robot-language/specification/api.yaml','robot-compiler/tests','robot-frontend-robosim/test','robostudio/tests','packages/robot-isa/canonical_isa.json','packages/robot-isa/capability_model.json','packages/robot-isa/target_profiles.json','packages/robot-isa/compatibility_policy.json','tests','tests/ui_responsive/run_ui_responsive.py','tests/ui_production/run_ui_production.py','tests/line_follow_stability/run_line_follow_stability.py','tests/vm_responsiveness/run_vm_responsiveness_baseline.py','tests/vm_responsiveness/run_run_slice_core.py','tests/vm_responsiveness/vm_rt_contract_guard.py','tests/vm_responsiveness/run_vm_rt_negative.py','tests/vm_responsiveness/run_compatibility_replay.py','tests/vm_responsiveness/run_vm_rt_ci.py','tests/vm_responsiveness/fixtures/compatibility_replay_v1.json','tests/b2_2/run_b2_2.py','tests/b2_2/run_portable_child_closure.py','tests/b2_3/run_b2_3.py','tests/b2_3/run_settings_isolation.py','tests/b2_3/run_hardware_runtime_path_contract.py','tests/b2_3/run_firmware_workspace_lock_regression.py','tests/b2_3/run_deployment_concurrency.py','tests/b2_3/run_artifact_output_contract.py','tests/b2_4/run_b2_4.py','tests/b2_4/run_packaged_flash_boundary.py','tests/b2_5/run_b2_5.py','tests/b2_6/run_b2_6.py','tests/b2_7/run_b2_7.py','tests/b2_7/run_firmware_source_transients.py','tests/b2_7/run_packaged_offline_first_flash.py','tests/h26_a/run_h26_a.py','tests/h26_b/run_h26_b.py','tests/h28_b/run_h28_b.py','tests/h30_multi_robot/run_h30_multi_robot.py','tests/h31_boolean/run_h31_boolean.py','tests/h32_platform_contract/run_h32_platform_contract.py','tests/h33_capability_compiler/run_h33_capability_compiler.py','tests/h34_contract_traceability/run_h34_contract_traceability.py','tests/h35_compatibility/run_h35_compatibility.py','docs/H26-B_CONTRACT_BASELINE.json','docs/H35_COMPATIBILITY_UPGRADE_POLICY.md','robot-compiler/compiler/target_contract.py','tools/platform_contract.py','tools/compatibility_policy.py','tools/ci_impact.py','tools/hardware_feature_config.py','tools/hardware_preflight.py','tools/clean_machine_physical_e2e.py','tools/copy_run_contract.py','tools/copy_run_release.py','tools/one_click_production_zip.py','tools/packaged_platformio_offline_first_flash.py','BUILD_PRODUCTION_ZIP.cmd','scripts/Build-ProductionZip.ps1','run_all_tests.py']; missing=[p for p in required if not Path(p).exists()]; assert not missing, f'Missing test boundaries/runner: {missing}'; print('PASS: test topology boundaries')"

      - name: Run VM responsiveness gates
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.vm == 'true' }}
        shell: pwsh
        run: python tests/vm_responsiveness/run_vm_rt_ci.py

      - name: Run VM compiler compatibility gate
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.vm == 'true' }}
        shell: pwsh
        run: python robot-compiler/tests/run_tests.py

      - name: Run VM line-follow regression gate
        if: ${{ steps.impact.outputs.full != 'true' && (steps.impact.outputs.vm == 'true' || steps.impact.outputs.line == 'true') }}
        shell: pwsh
        run: python tests/line_follow_stability/run_line_follow_stability.py

      - name: Install PlatformIO for impacted firmware compile
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.vm == 'true' }}
        shell: pwsh
        run: python -m pip install "platformio>=6.1,<7"

      - name: Compile impacted ESP32 firmware
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.vm == 'true' }}
        shell: pwsh
        run: python -m platformio run -d robot-platform -e esp32dev

      - name: Run platform contract consolidation gate
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.contracts == 'true' }}
        shell: pwsh
        run: python tests/h32_platform_contract/run_h32_platform_contract.py

      - name: Run capability-compiler binding gate
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.contracts == 'true' }}
        shell: pwsh
        run: python tests/h33_capability_compiler/run_h33_capability_compiler.py

      - name: Run contract traceability gate
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.contracts == 'true' }}
        shell: pwsh
        run: python tests/h34_contract_traceability/run_h34_contract_traceability.py

      - name: Run compatibility and upgrade policy gate
        if: ${{ steps.impact.outputs.full != 'true' && (steps.impact.outputs.contracts == 'true' || steps.impact.outputs.vm == 'true') }}
        shell: pwsh
        run: python tests/h35_compatibility/run_h35_compatibility.py

      - name: Run RoboStudio responsive UI contract gate
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.robostudio == 'true' }}
        shell: pwsh
        run: python tests/ui_responsive/run_ui_responsive.py

      - name: Run RoboStudio production UX contract gate
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.robostudio == 'true' }}
        shell: pwsh
        run: python tests/ui_production/run_ui_production.py

      - name: Run RoboStudio path/state isolation gates
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.robostudio == 'true' }}
        shell: pwsh
        run: |
          python tests/b2_3/run_b2_3.py
          python tests/b2_3/run_settings_isolation.py

      - name: Run packaging/deployment contract gates
        if: ${{ steps.impact.outputs.full != 'true' && steps.impact.outputs.packaging == 'true' }}
        shell: pwsh
        run: |
          python tests/b2_2/run_b2_2.py
          python tests/b2_2/run_portable_child_closure.py
          python tests/b2_3/run_hardware_runtime_path_contract.py
          python tests/b2_3/run_firmware_workspace_lock_regression.py
          python tests/b2_3/run_deployment_concurrency.py
          python tests/b2_3/run_artifact_output_contract.py
          python tests/h28_b/run_h28_b.py
          python tests/b2_4/run_b2_4.py
          python tests/b2_4/run_packaged_flash_boundary.py
          python tests/b2_5/run_b2_5.py
          python tests/b2_6/run_b2_6.py
          python tests/b2_7/run_b2_7.py
          python tests/b2_7/run_firmware_source_transients.py

      - name: Run repository regression suite
        if: ${{ steps.impact.outputs.full == 'true' }}
        shell: pwsh
        run: python run_all_tests.py

      - name: Run B2.7 full Windows production ZIP build
        if: ${{ steps.impact.outputs.release == 'true' }}
        shell: cmd
        run: BUILD_PRODUCTION_ZIP.cmd --clean

      - name: Run packaged PlatformIO offline first-flash evidence gate
        if: ${{ steps.impact.outputs.release == 'true' }}
        shell: pwsh
        run: python tests/b2_7/run_packaged_offline_first_flash.py

      - name: Upload Windows production build
        if: ${{ steps.impact.outputs.release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: RoboStudio-Production-Windows
          path: releases/production/
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure artifacts
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path . -Recurse -File -Include *.json,*.log,*.txt |
            Where-Object { $_.FullName -notmatch '\\.git[\\/]' } |
            ForEach-Object {
              $destination = Join-Path artifacts $_.Name
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
