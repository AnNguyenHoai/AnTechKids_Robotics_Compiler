name: Robotics Compiler Tests

on:
  push:
    branches:
      - main
      - "rsd-*"
      - "audit/**"
      - "fix/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          git --version

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pytest

      - name: Run pytest
        shell: pwsh
        run: python -m pytest -q

      - name: RSD-11
        shell: pwsh
        run: python tests/rsd_11/run_rsd_11.py

      - name: RSD-15
        shell: pwsh
        run: python tests/rsd_15/run_rsd_15.py

      - name: RSD-17
        shell: pwsh
        run: python tests/rsd_17/run_rsd_17.py

      - name: RSD-20
        shell: pwsh
        run: python tests/rsd_20/run_rsd_20.py

      - name: RSD-21.3
        shell: pwsh
        run: python tests/rsd_21_3/run_rsd_21_3.py

      - name: RSD-21.4
        shell: pwsh
        run: python tests/rsd_21_4/run_rsd_21_4.py

      - name: RSD-21.5
        shell: pwsh
        run: python tests/rsd_21_5/run_rsd_21_5.py

      - name: RSD-21.6
        shell: pwsh
        run: python tests/rsd_21_6/run_rsd_21_6.py

      - name: RSD-21.7
        shell: pwsh
        run: python tests/rsd_21_7/run_rsd_21_7.py

      - name: RSD-21.8
        shell: pwsh
        run: python tests/rsd_21_8/run_rsd_21_8.py

      - name: Collect test artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path . -Recurse -File -Include *.json,*.log,*.txt |
            Where-Object { $_.FullName -notmatch '\\.git[\\/]' } |
            ForEach-Object {
              $destination = Join-Path artifacts $_.Name
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
