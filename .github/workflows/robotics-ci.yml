name: Robotics Compiler Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          git --version

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-ci.txt

      - name: Validate test topology
        shell: pwsh
        run: |
          python -c "from pathlib import Path; required=['robot-language/tests','robot-compiler/tests','robot-frontend-robosim/test','robostudio/tests','tests','tests/b2_2/run_b2_2.py','tests/b2_2/run_portable_child_closure.py','tests/b2_3/run_b2_3.py','tests/b2_3/run_settings_isolation.py','tests/b2_4/run_b2_4.py','tests/b2_4/run_packaged_flash_boundary.py','tests/b2_5/run_b2_5.py','tests/b2_6/run_b2_6.py','tests/b2_7/run_b2_7.py','tests/b2_7/run_firmware_source_transients.py','tests/h30_multi_robot/run_h30_multi_robot.py','tests/h31_boolean/run_h31_boolean.py','tools/hardware_preflight.py','tools/clean_machine_physical_e2e.py','tools/copy_run_contract.py','tools/copy_run_release.py','tools/one_click_production_zip.py','BUILD_PRODUCTION_ZIP.cmd','scripts/Build-ProductionZip.ps1','run_all_tests.py']; missing=[p for p in required if not Path(p).exists()]; assert not missing, f'Missing test boundaries/runner: {missing}'; print('PASS: test topology boundaries')"

      - name: Run B2.2 dependency closure gate
        shell: pwsh
        run: python tests/b2_2/run_b2_2.py

      - name: Run B2.2 portable child closure gate
        shell: pwsh
        run: python tests/b2_2/run_portable_child_closure.py

      - name: Run B2.3 path and state isolation gate
        shell: pwsh
        run: python tests/b2_3/run_b2_3.py

      - name: Run B2.3 RoboStudio mutable-state gate
        shell: pwsh
        run: python tests/b2_3/run_settings_isolation.py

      - name: Run B2.4 hardware and flash portability gate
        shell: pwsh
        run: python tests/b2_4/run_b2_4.py

      - name: Run B2.4 packaged flash runtime boundary gate
        shell: pwsh
        run: python tests/b2_4/run_packaged_flash_boundary.py

      - name: Run B2.5 clean-machine physical E2E harness gate
        shell: pwsh
        run: python tests/b2_5/run_b2_5.py

      - name: Run B2.6 release copy-and-run contract gate
        shell: pwsh
        run: python tests/b2_6/run_b2_6.py

      - name: Smoke B2.7 one-click launcher plan
        shell: cmd
        run: BUILD_PRODUCTION_ZIP.cmd --plan

      - name: Run B2.7 one-click production ZIP gate
        shell: pwsh
        run: python tests/b2_7/run_b2_7.py

      - name: Run B2.7 dirty firmware source boundary gate
        shell: pwsh
        run: python tests/b2_7/run_firmware_source_transients.py

      - name: Run H30 multi-robot management gate
        shell: pwsh
        run: python tests/h30_multi_robot/run_h30_multi_robot.py

      - name: Run H31 boolean expression completeness gate
        shell: pwsh
        run: python tests/h31_boolean/run_h31_boolean.py

      - name: Run B2.7 full Windows production ZIP build
        shell: cmd
        run: BUILD_PRODUCTION_ZIP.cmd --clean

      - name: Upload Windows production build
        uses: actions/upload-artifact@v4
        with:
          name: RoboStudio-Production-Windows
          path: releases/production/
          if-no-files-found: error
          retention-days: 30

      - name: Run repository regression suite
        shell: pwsh
        run: python run_all_tests.py

      - name: Collect test artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path . -Recurse -File -Include *.json,*.log,*.txt |
            Where-Object { $_.FullName -notmatch '\\.git[\\/]' } |
            ForEach-Object {
              $destination = Join-Path artifacts $_.Name
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
