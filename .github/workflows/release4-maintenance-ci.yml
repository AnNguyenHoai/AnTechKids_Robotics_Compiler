name: Release 4 Maintenance CI

on:
  push:
    branches:
      - maintenance/release-4.0.0-student-stability
  pull_request:
    branches:
      - maintenance/release-4.0.0-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-tests:
    name: Release 4 Maintenance Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-ci.txt

      - name: Verify maintenance branch identity
        shell: pwsh
        run: |
          Write-Host "Ref: $env:GITHUB_REF"
          Write-Host "SHA: $env:GITHUB_SHA"
          git log -1 --oneline

      - name: Run repository regression suite
        shell: pwsh
        run: python run_all_tests.py

      - name: Build Release 4 production ZIP
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/Build-ProductionZip.ps1 --clean

      - name: Upload Release 4 production build
        uses: actions/upload-artifact@v4
        with:
          name: RoboStudio-Release4-Maintenance-Windows
          path: releases/production/
          if-no-files-found: error
          retention-days: 30

      - name: Collect test artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path . -Recurse -File -Include *.json,*.log,*.txt |
            Where-Object { $_.FullName -notmatch '\\.git[\\/]' } |
            ForEach-Object {
              $destination = Join-Path artifacts $_.Name
              Copy-Item $_.FullName $destination -Force -ErrorAction SilentlyContinue
            }

      - name: Upload maintenance test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release4-maintenance-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
