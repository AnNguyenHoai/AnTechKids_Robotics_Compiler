name: V2 Hardware ON OFF Matrix

on:
  push:
    branches: [main_V2]
    paths:
      - "robostudio/domain/hardware_build_matrix.py"
      - "robostudio/domain/hardware_config.py"
      - "robostudio/domain/hardware_macro_generator.py"
      - "robostudio/domain/device_registry.py"
      - "tools/hardware_feature_config.py"
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "tests/v2_hardware_on_off_matrix/**"
      - "tests/v2_hardware_config/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-hardware-on-off-matrix.yml"
  workflow_dispatch:

jobs:
  v2-hardware-on-off-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py tests/v2_hardware_on_off_matrix/run_v2_hardware_on_off_matrix.py
      - name: V2 hardware ON/OFF matrix acceptance
        run: python tests/v2_hardware_on_off_matrix/run_v2_hardware_on_off_matrix.py
      - name: HardwareConfig V2 migration regression
        run: python tests/v2_hardware_config/run_v2_hardware_config.py
