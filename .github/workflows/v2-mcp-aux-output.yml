name: V2 MCP Auxiliary Outputs

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Services/Output/**"
      - "robot-platform/main/src/HardwareAbstraction/GPIO.h"
      - "robot-platform/main/src/HardwareAbstraction/MCP23017*"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-compiler/compiler/handlers/led_handler.py"
      - "robot-compiler/compiler/handlers/peripheral_handler.py"
      - "tests/v2_aux_output/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-mcp-aux-output.yml"
  workflow_dispatch:

jobs:
  mcp-aux-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: MCP regression
        run: python tests/v2_mcp23017/run_v2_mcp23017.py
      - name: Auxiliary output contract
        run: python tests/v2_aux_output/run_v2_aux_output.py
