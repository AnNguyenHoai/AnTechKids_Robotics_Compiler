name: V2 Motor Safety Acceptance

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/HardwareAbstraction/MotorSafety*"
      - "robot-platform/main/src/HardwareAbstraction/StartArm*"
      - "robot-platform/main/src/Health/BatteryMonitor*"
      - "robot-platform/main/src/Health/BatterySafety*"
      - "robot-platform/main/src/Health/ResetReason*"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-platform/main/src/Services/Robot/RobotMotorSafetyInternal.h"
      - "robot-platform/main/src/Communication/RobotNetworkService.cpp"
      - "robot-platform/main/main.ino"
      - "tests/v2_motor_safety_acceptance/**"
      - "tests/v2_motor_safety/**"
      - "tests/v2_start_arm/**"
      - "tests/v2_fail_safe_disarm/**"
      - "tests/v2_battery_safety/**"
      - "tests/v2_reset_reason/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-motor-safety-acceptance.yml"
  workflow_dispatch:

jobs:
  motor-safety-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py
      - name: MotorSafety unit contract
        run: python tests/v2_motor_safety/run_v2_motor_safety.py
      - name: START/ARM contract
        run: python tests/v2_start_arm/run_v2_start_arm.py
      - name: Fail-safe lifecycle contract
        run: python tests/v2_fail_safe_disarm/run_v2_fail_safe_disarm.py
      - name: Critical battery contract
        run: python tests/v2_battery_safety/run_v2_battery_safety.py
      - name: Reset reason contract
        run: python tests/v2_reset_reason/run_v2_reset_reason.py
      - name: Integrated Motor Safety acceptance
        run: python tests/v2_motor_safety_acceptance/run_v2_motor_safety_acceptance.py
