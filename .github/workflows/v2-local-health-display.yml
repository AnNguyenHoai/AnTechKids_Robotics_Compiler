name: V2 Local Health Display

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Health/LocalHealthDisplay*"
      - "robot-platform/main/src/Health/ILocalHealthDisplay.h"
      - "robot-platform/main/src/Health/NullLocalHealthDisplay.h"
      - "robot-platform/main/main.ino"
      - "tests/v2_local_health_display/**"
      - "tests/v2_robot_health/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-local-health-display.yml"
  workflow_dispatch:

jobs:
  local-health-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: RobotHealth aggregate regression
        run: python tests/v2_robot_health/run_v2_robot_health.py
      - name: Local display contract
        run: python tests/v2_local_health_display/run_v2_local_health_display.py
