name: V2 MCP23017 Contract

on:
  push:
    branches:
      - main_V2
    paths:
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "robot-platform/main/src/HardwareAbstraction/IMCP23017Transport.h"
      - "robot-platform/main/src/HardwareAbstraction/MCP23017Driver.*"
      - "robot-platform/main/src/HardwareAbstraction/MCP23017WireTransport.*"
      - "robot-platform/main/src/HardwareAbstraction/SystemI2CBusManager.*"
      - "tests/v2_mcp23017/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-mcp23017-contract.yml"
  workflow_dispatch:

jobs:
  mcp23017-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main_V2
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run System I2C regression
        run: python tests/v2_system_i2c/run_v2_system_i2c.py
      - name: Run MCP23017 contract
        run: python tests/v2_mcp23017/run_v2_mcp23017.py
