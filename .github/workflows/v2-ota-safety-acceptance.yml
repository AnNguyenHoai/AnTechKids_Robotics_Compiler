name: V2 OTA Safety Acceptance

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Communication/RobotNetworkService.cpp"
      - "robot-platform/main/src/Services/Robot/RobotAPI.*"
      - "robot-platform/main/src/Services/Robot/RobotMotorSafetyInternal.h"
      - "robot-platform/main/src/HardwareAbstraction/MotorSafetyController.*"
      - "robot-platform/main/src/HardwareAbstraction/StartArmController.*"
      - "robot-platform/main/main.ino"
      - "tests/v2_ota_safety_acceptance/**"
      - "tests/v2_vm_safety_boundary/**"
      - "tests/v2_fail_safe_disarm/**"
      - "tests/v2_motor_safety_acceptance/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-ota-safety-acceptance.yml"
  workflow_dispatch:

jobs:
  ota-safety-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py tests/v2_ota_safety_acceptance/run_v2_ota_safety_acceptance.py
      - name: OTA safety acceptance
        run: python tests/v2_ota_safety_acceptance/run_v2_ota_safety_acceptance.py
      - name: VM safety boundary regression
        run: python tests/v2_vm_safety_boundary/run_v2_vm_safety_boundary.py
      - name: Fail-safe disarm regression
        run: python tests/v2_fail_safe_disarm/run_v2_fail_safe_disarm.py
      - name: Integrated motor safety regression
        run: python tests/v2_motor_safety_acceptance/run_v2_motor_safety_acceptance.py
