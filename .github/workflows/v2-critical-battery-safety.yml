name: V2 Critical Battery Safety

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Health/BatterySafety*"
      - "robot-platform/main/src/Health/IBatterySafetyActions.h"
      - "robot-platform/main/src/Health/BatteryMonitor*"
      - "robot-platform/main/src/HardwareAbstraction/MotorSafetyController.*"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-platform/main/main.ino"
      - "tests/v2_battery_safety/**"
      - "tests/v2_battery_monitor/**"
      - "tests/v2_motor_safety/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-critical-battery-safety.yml"
  workflow_dispatch:

jobs:
  critical-battery-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: BatteryMonitor regression
        run: python tests/v2_battery_monitor/run_v2_battery_monitor.py
      - name: MotorSafety regression
        run: python tests/v2_motor_safety/run_v2_motor_safety.py
      - name: Critical battery safety contract
        run: python tests/v2_battery_safety/run_v2_battery_safety.py
