name: V2 Reset Reason Contract

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Health/ResetReason*"
      - "robot-platform/main/src/Health/IResetReasonSource.h"
      - "robot-platform/main/src/Health/Esp32ResetReasonSource.*"
      - "robot-platform/main/src/HardwareAbstraction/MotorSafetyController.*"
      - "robot-platform/main/main.ino"
      - "tests/v2_reset_reason/**"
      - "tests/v2_motor_safety/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-reset-reason-contract.yml"
  workflow_dispatch:

jobs:
  reset-reason-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: MotorSafety regression
        run: python tests/v2_motor_safety/run_v2_motor_safety.py
      - name: ResetReason contract
        run: python tests/v2_reset_reason/run_v2_reset_reason.py
