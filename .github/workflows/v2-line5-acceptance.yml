name: V2 Line5 Acceptance

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Services/Line/**"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-platform/main/src/Services/Robot/RobotAPI.h"
      - "robot-platform/main/src/HardwareAbstraction/MCP23017*"
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "tests/v2_line5_acceptance/**"
      - "tests/v2_line_sensor_bank/**"
      - "tests/v2_line_api_compat/**"
      - "tests/v2_line_perception/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-line5-acceptance.yml"
  workflow_dispatch:

jobs:
  line5-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py
      - name: LineSensorBank regression
        run: python tests/v2_line_sensor_bank/run_v2_line_sensor_bank.py
      - name: Line API compatibility regression
        run: python tests/v2_line_api_compat/run_v2_line_api_compat.py
      - name: Line perception/control regression
        run: python tests/v2_line_perception/run_v2_line_perception.py
      - name: Integrated Line5 acceptance
        run: python tests/v2_line5_acceptance/run_v2_line5_acceptance.py
