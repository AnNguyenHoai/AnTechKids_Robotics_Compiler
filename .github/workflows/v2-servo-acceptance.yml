name: V2 Servo Acceptance

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/HardwareAbstraction/Servo*"
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-platform/main/src/Services/Robot/RobotAPI.h"
      - "robot-platform/main/src/Services/VM/VM.cpp"
      - "robot-compiler/compiler/handlers/servo_handler.py"
      - "tests/v2_servo/**"
      - "tests/v2_servo_acceptance/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-servo-acceptance.yml"
  workflow_dispatch:

jobs:
  servo-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py
      - name: Servo HAL regression
        run: python tests/v2_servo/run_v2_servo.py
      - name: Integrated Servo acceptance
        run: python tests/v2_servo_acceptance/run_v2_servo_acceptance.py
