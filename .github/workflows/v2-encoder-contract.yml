name: V2 Encoder Contract

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Devices/Encoder.*"
      - "robot-platform/main/src/Sensor/QuadratureDecoder.h"
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "robot-platform/main/src/HardwareAbstraction/GPIO.h"
      - "robot-platform/main/src/Services/Robot/RobotAPI.*"
      - "robot-platform/main/src/Communication/SerialCommandHandler.cpp"
      - "tests/v2_encoder/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-encoder-contract.yml"
  workflow_dispatch:

jobs:
  encoder-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: BoardProfile regression
        run: python tests/v2_board_profile/run_v2_board_profile.py
      - name: Encoder contract
        run: python tests/v2_encoder/run_v2_encoder.py
