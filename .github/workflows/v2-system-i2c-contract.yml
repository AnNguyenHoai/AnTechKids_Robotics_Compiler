name: V2 System I2C Contract

on:
  push:
    branches:
      - main_V2
    paths:
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "robot-platform/main/src/HardwareAbstraction/SystemI2CBusManager.*"
      - "robot-platform/main/src/Drivers/MPU6050/**"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "tests/v2_system_i2c/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-system-i2c-contract.yml"
  workflow_dispatch:

jobs:
  system-i2c-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main_V2
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run V2 System I2C contract
        run: python tests/v2_system_i2c/run_v2_system_i2c.py
