name: V2 HardwareConfig Migration

on:
  push:
    branches: [main_V2]
    paths:
      - "robostudio/domain/hardware_config.py"
      - "robostudio/domain/hardware_config_service.py"
      - "robostudio/config/hardware.json"
      - "tools/hardware_feature_config.py"
      - "robostudio/domain/hardware_macro_generator.py"
      - "tests/v2_hardware_config/**"
      - "robostudio/tests/test_hardware_config.py"
      - "robostudio/tests/test_hardware_macro_generator.py"
      - "tests/b2_3/run_hardware_runtime_path_contract.py"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-hardware-config-migration.yml"
  workflow_dispatch:

jobs:
  hardware-config-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py
      - name: V2 HardwareConfig contract
        run: python tests/v2_hardware_config/run_v2_hardware_config.py
      - name: Hardware runtime path regression
        run: python tests/b2_3/run_hardware_runtime_path_contract.py
      - name: RoboStudio HardwareConfig unittest regression
        run: PYTHONPATH=robostudio:. python robostudio/tests/test_hardware_config.py
