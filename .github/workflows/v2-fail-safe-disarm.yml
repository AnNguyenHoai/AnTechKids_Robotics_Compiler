name: V2 Fail Safe Disarm Contract

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Services/Robot/RobotMotorSafetyInternal.h"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-platform/main/src/Communication/RobotNetworkService.cpp"
      - "robot-platform/main/src/Communication/SerialCommandHandler.cpp"
      - "robot-platform/main/main.ino"
      - "robot-platform/main/src/HardwareAbstraction/MotorSafety*"
      - "robot-platform/main/src/HardwareAbstraction/StartArm*"
      - "tests/v2_fail_safe_disarm/**"
      - "tests/v2_motor_safety/**"
      - "tests/v2_start_arm/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-fail-safe-disarm.yml"
  workflow_dispatch:

jobs:
  fail-safe-disarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: MotorSafety regression
        run: python tests/v2_motor_safety/run_v2_motor_safety.py
      - name: START/ARM regression
        run: python tests/v2_start_arm/run_v2_start_arm.py
      - name: Fail-safe disarm contract
        run: python tests/v2_fail_safe_disarm/run_v2_fail_safe_disarm.py
