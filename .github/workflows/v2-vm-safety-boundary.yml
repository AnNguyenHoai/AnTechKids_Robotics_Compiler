name: V2 VM Safety Boundary

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Services/VM/**"
      - "robot-platform/main/src/Services/Robot/RobotAPI.*"
      - "robot-platform/main/src/HardwareAbstraction/MotorSafetyController.*"
      - "robot-platform/main/src/HardwareAbstraction/StartArmController.*"
      - "robot-platform/main/main.ino"
      - "tests/v2_vm_safety_boundary/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-vm-safety-boundary.yml"
  workflow_dispatch:

jobs:
  vm-safety-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runner syntax
        run: python -m py_compile run_all_tests.py tests/v2_vm_safety_boundary/run_v2_vm_safety_boundary.py
      - name: VM/student safety boundary acceptance
        run: python tests/v2_vm_safety_boundary/run_v2_vm_safety_boundary.py
      - name: Integrated motor safety regression
        run: python tests/v2_motor_safety_acceptance/run_v2_motor_safety_acceptance.py
