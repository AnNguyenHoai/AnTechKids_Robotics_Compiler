name: V2 Servo HAL Contract
# V2-SW-007 focused software verification gate.

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/HardwareAbstraction/Servo*"
      - "robot-platform/main/src/Compatibility/LEDCCompat.h"
      - "robot-platform/main/src/Services/Robot/RobotAPI.cpp"
      - "robot-platform/main/src/Services/VM/VM.cpp"
      - "robot-compiler/compiler/handlers/servo_handler.py"
      - "tests/v2_servo/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-servo-hal-contract.yml"
  workflow_dispatch:

jobs:
  servo-hal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: Run Servo HAL contract
        run: python tests/v2_servo/run_v2_servo.py
