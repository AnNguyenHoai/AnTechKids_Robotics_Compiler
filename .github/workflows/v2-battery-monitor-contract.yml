name: V2 Battery Monitor Contract

on:
  push:
    branches: [main_V2]
    paths:
      - "robot-platform/main/src/Health/BatteryMonitor*"
      - "robot-platform/main/src/Health/IBatteryAdcSource.h"
      - "robot-platform/main/src/Health/ArduinoBatteryAdcSource.*"
      - "robot-platform/main/src/Diagnostic/Diagnostic.cpp"
      - "robot-platform/main/src/HardwareAbstraction/BoardProfile.h"
      - "tests/v2_battery_monitor/**"
      - "run_all_tests.py"
      - "robot-docs/Robotics_V2_Software_Development_Requirements.md"
      - ".github/workflows/v2-battery-monitor-contract.yml"
  workflow_dispatch:

jobs:
  battery-monitor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate test runner syntax
        run: python -m py_compile run_all_tests.py
      - name: BoardProfile regression
        run: python tests/v2_board_profile/run_v2_board_profile.py
      - name: Encoder regression
        run: python tests/v2_encoder/run_v2_encoder.py
      - name: BatteryMonitor contract
        run: python tests/v2_battery_monitor/run_v2_battery_monitor.py
