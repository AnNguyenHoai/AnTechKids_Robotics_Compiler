; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: board folding, storage size

[platformio]
; The canonical Arduino application lives under main/.
; Keeping this explicit makes PlatformIO build the same firmware that is
; flashed through Arduino IDE, including main.ino setup()/loop().
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; USB upload remains the default/recovery path.
upload_port = COM4

; Network configuration is injected from environment variables by wifi_config.py.
extra_scripts = pre:wifi_config.py

; Monitor settings
monitor_speed = 115200

; Build flags
build_flags =
    -I main
    -I main/src
    -I main/src/Application
    -I main/src/Behavior
    -I main/src/Communication
    -I main/src/Devices
    -I main/src/Diagnostic
    -I main/src/Drivers
    -I main/src/HardwareAbstraction
    -I main/src/Logger
    -I main/src/Services/Robot
    -I main/src/Services/VM
    -I main/include/generated

; Include the canonical application source tree and main.ino.
build_src_filter = +<*>

lib_deps =
    ; Built-in Arduino ESP32 networking/OTA APIs are used.

; OTA upload environment. Use with: pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.ROBOT_OTA_HOST}
upload_flags =
    --auth=${sysenv.ROBOT_OTA_PASSWORD}

; First-flash environment. A RoboStudio-generated bootstrap artifact is
; consumed by wifi_config.py and USB-flashed into a new robot.
[env:esp32dev_bootstrap]
extends = env:esp32dev
