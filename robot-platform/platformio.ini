; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: board folding, storage size

[platformio]
; The canonical Arduino application lives under main/.
; Keeping this explicit makes PlatformIO build the same firmware that is
; flashed through Arduino IDE, including main.ino setup()/loop().
src_dir = main

[env:esp32dev]
; Production dependency closure requires an exact platform version.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; PlatformIO's ESP32 USB upload path dynamically enables filesystem tooling
; even though these packages are optional in the platform manifest. Pin them at
; the project boundary so the production builder provisions/bundles them and a
; clean target machine never falls back to Tool Manager downloads during first-flash.
platform_packages =
    platformio/tool-mkspiffs@~2.230.0
    platformio/tool-mklittlefs@~1.203.0
    platformio/tool-mkfatfs@~2.0.0

; B2.4: USB upload ports are selected and validated at runtime. Never keep a
; developer-machine COM fallback here; every USB upload command supplies an
; explicit --upload-port after hardware preflight.

; Network configuration is injected before the build. The post script replaces
; Espressif's direct esptool.py invocation with a small runner that restores the
; tool package directory to sys.path when RoboStudio uses embedded Python with
; python310._pth isolation.
extra_scripts =
    pre:wifi_config.py
    post:esptool_path_fix.py

; Monitor settings
monitor_speed = 115200

; Build flags
build_flags =
    -I main
    -I main/src
    -I main/src/Application
    -I main/src/Behavior
    -I main/src/Communication
    -I main/src/Devices
    -I main/src/Diagnostic
    -I main/src/Drivers
    -I main/src/HardwareAbstraction
    -I main/src/Logger
    -I main/src/Services/Robot
    -I main/src/Services/VM
    -I main/include/generated

; Include the canonical application source tree and main.ino.
build_src_filter = +<*>

lib_deps =
    ; Built-in Arduino ESP32 networking/OTA APIs are used.

; OTA upload environment. Use with: pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.ROBOT_OTA_HOST}
upload_flags =
    --auth=${sysenv.ROBOT_OTA_PASSWORD}

; First-flash environment. A RoboStudio-generated bootstrap artifact is
; consumed by wifi_config.py and USB-flashed into a new robot.
[env:esp32dev_bootstrap]
extends = env:esp32dev
