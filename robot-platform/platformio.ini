; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: board folding, storage size

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; USB upload remains the default/recovery path.
upload_port = COM4

; Network configuration is injected from environment variables by wifi_config.py.
extra_scripts = pre:wifi_config.py

; Monitor settings
monitor_speed = 115200

; Build flags
build_flags =
    -I src
    -I src/Application
    -I src/Behavior
    -I src/Communication
    -I src/Devices
    -I src/Diagnostic
    -I src/Drivers
    -I src/HardwareAbstraction
    -I src/Logger
    -I src/Services/Robot
    -I src/Services/VM
    -I include/generated

src_filter = +<src/*>

lib_deps =
    ; Built-in Arduino ESP32 networking/OTA APIs are used.

; OTA upload environment. Use with: pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.ROBOT_OTA_HOST}
upload_flags =
    --auth=${sysenv.ROBOT_OTA_PASSWORD}

; First-flash environment. A RoboStudio-generated bootstrap artifact is
; consumed by wifi_config.py and USB-flashed into a new robot.
[env:esp32dev_bootstrap]
extends = env:esp32dev
